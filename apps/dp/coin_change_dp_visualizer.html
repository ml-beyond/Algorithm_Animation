
<h2 class="sr-only">Coin Change II — interactive DP combination-counting visualizer</h2>
<style>
.kp-icard{padding:8px 12px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-family:var(--font-mono);font-size:13px;display:flex;flex-direction:column;gap:3px;transition:background .2s,border-color .2s;min-width:72px;align-items:center}
.kp-icard.active{border-color:#185FA5;background:#E6F1FB}
.kp-icard input[type=number]{width:36px;font-family:var(--font-mono);font-size:14px;border:none;background:transparent;color:inherit;padding:0;text-align:center;-moz-appearance:textfield}
.kp-icard input::-webkit-inner-spin-button{display:none}
.kp-cb{color:var(--color-text-tertiary)}
.kp-cd{color:var(--color-text-tertiary);font-style:italic}
.kp-cn{color:var(--color-text-primary)}
.kp-cu{background:#EAF3DE;color:#3B6D11;border-radius:3px}
.kp-cc{background:#185FA5;color:#fff;border-radius:3px;font-weight:500}
@media(prefers-color-scheme:dark){
  .kp-icard.active{border-color:#378ADD;background:#0C447C}
  .kp-cu{background:#27500A;color:#C0DD97}
  .kp-cc{background:#378ADD;color:#fff}
}
#kp-tbl{border-collapse:collapse;font-family:var(--font-mono);font-size:13px}
#kp-tbl th,#kp-tbl td{padding:4px 8px;text-align:center}
.kp-rl{text-align:left !important;color:var(--color-text-secondary);border-right:0.5px solid var(--color-border-tertiary);padding-right:10px !important;white-space:nowrap;font-size:12px}
.kp-ch{color:var(--color-text-tertiary);font-weight:400;font-size:11px;border-bottom:0.5px solid var(--color-border-tertiary)}
</style>

<div style="padding:1rem 0">

<div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:6px">coins — click to edit denomination</div>
<div id="kp-items" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:flex-start"></div>

<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:1rem">
  <div style="display:flex;align-items:center;gap:6px">
    <span style="font-size:13px;color:var(--color-text-secondary)">amount =</span>
    <input type="number" id="kp-cap" min="0" max="20" value="5" style="width:55px" onchange="kpRebuild()">
  </div>
  <div style="display:flex;gap:6px">
    <button onclick="kpReset()">↺ Reset</button>
    <button onclick="kpStep()">Step →</button>
    <button id="kp-pb" onclick="kpToggle()">▶ Play</button>
  </div>
  <div style="display:flex;align-items:center;gap:5px">
    <span style="font-size:11px;color:var(--color-text-tertiary)">slow</span>
    <input type="range" id="kp-spd" min="1" max="5" value="3" style="width:70px" oninput="kpSpd()">
    <span style="font-size:11px;color:var(--color-text-tertiary)">fast</span>
  </div>
</div>

<div id="kp-stat" style="font-family:var(--font-mono);font-size:12px;padding:8px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);margin-bottom:1rem;color:var(--color-text-secondary);min-height:34px;line-height:1.6">Press ▶ Play or Step → to begin.</div>

<div style="overflow-x:auto;margin-bottom:1rem"><table id="kp-tbl"></table></div>
<div id="kp-res" style="display:none"></div>
</div>

<script>
(function(){
const KP={
  coins:[1,2,5],
  A:5,steps:[],idx:0,playing:false,timer:null,
  speeds:[700,450,250,120,50],spdIdx:2
};

function snap(dp){return dp.map(r=>[...r]);}

function compute(){
  KP.steps=[];
  const coins=KP.coins.slice().sort((a,b)=>a-b);
  KP.sortedCoins=coins;
  const n=coins.length,A=KP.A;
  const dp=Array.from({length:n+1},()=>new Array(A+1).fill(0));
  dp[0][0]=1;
  KP.steps.push({phase:'init',dp:snap(dp),item:0,j:-1,
    desc:'Base case: f[0] = 1 (one way to reach amount 0 — use no coins). f[j] = 0 for j > 0.'});
  for(let i=1;i<=n;i++){
    for(let j=0;j<=A;j++) dp[i][j]=dp[i-1][j];
    const c=coins[i-1];
    KP.steps.push({phase:'start',dp:snap(dp),item:i,j:-1,
      desc:`Coin ${i} (denomination = ${c}). Copy row ${i-1}, then scan j from ${c} to ${A} (left→right, infinite supply).`});
    for(let j=c;j<=A;j++){
      const prev=dp[i][j],addend=dp[i][j-c];
      dp[i][j]+=addend;
      KP.steps.push({phase:'upd',dp:snap(dp),item:i,j,prev,addend,newVal:dp[i][j],upd:addend>0,
        desc:`j=${j}: f[${j}] = f[${j}] + f[${j-c}]  =  ${prev} + ${addend}  =  ${dp[i][j]}`});
    }
  }
  KP.steps.push({phase:'done',dp:snap(dp),item:n+1,j:-1,
    desc:`Done! Number of combinations for amount ${A} = f[${A}] = ${dp[n][A]}.`});
}

function cellInfo(i,j,step){
  const{item:ci,j:cj,phase,dp}=step;
  if(i===0) return['kp-cb',dp[i][j]];
  if(i>ci||(i===ci&&phase==='init')) return['kp-cd','·'];
  if(i===ci){
    if(phase==='start') return['kp-cd',dp[i][j]];
    if(j===cj) return['kp-cc',dp[i][j]];
    if(j<cj) return[dp[i][j]!==dp[i-1][j]?'kp-cu':'kp-cn',dp[i][j]];
    return['kp-cd',dp[i][j]];
  }
  return[dp[i][j]!==dp[i-1][j]?'kp-cu':'kp-cn',dp[i][j]];
}

function buildTable(){
  const step=KP.steps[KP.idx],n=KP.sortedCoins.length,A=KP.A;
  let h='<thead><tr><th class="kp-ch kp-rl" style="text-align:left">i \\ j</th>';
  for(let j=0;j<=A;j++) h+=`<th class="kp-ch">${j}</th>`;
  h+='</tr></thead><tbody>';
  for(let i=0;i<=n;i++){
    const sub=i>0?` <span style="color:var(--color-text-tertiary)">(c=${KP.sortedCoins[i-1]})</span>`:'';
    h+=`<tr><td class="kp-rl">${i===0?'∅':i}${sub}</td>`;
    for(let j=0;j<=A;j++){const[cls,val]=cellInfo(i,j,step);h+=`<td class="${cls}">${val}</td>`;}
    h+='</tr>';
  }
  document.getElementById('kp-tbl').innerHTML=h+'</tbody>';
}

function getCombinations(coins,amount){
  const result=[];
  const sorted=[...coins].sort((a,b)=>a-b);
  function bt(start,rem,cur){
    if(rem===0){result.push([...cur]);return;}
    for(let i=start;i<sorted.length;i++){
      if(sorted[i]<=rem){cur.push(sorted[i]);bt(i,rem-sorted[i],cur);cur.pop();}
    }
  }
  bt(0,amount,[]);
  return result;
}

function buildResult(){
  const el=document.getElementById('kp-res'),step=KP.steps[KP.idx];
  if(step.phase!=='done'){el.style.display='none';return;}
  const dp=step.dp,n=KP.sortedCoins.length,A=KP.A,count=dp[n][A];
  const combos=count>0&&A<=20?getCombinations(KP.sortedCoins,A):[];
  const showCombos=combos.length>0&&combos.length<=12;
  el.style.display='block';
  el.innerHTML=`<div style="padding:12px 14px;border-left:2px solid #1D9E75;background:var(--color-background-secondary);border-radius:var(--border-radius-md);font-family:var(--font-mono)">
    <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:4px">result</div>
    <div style="font-size:18px;font-weight:500;margin-bottom:${showCombos?'8':'0'}px">${count===0?'0 combinations (impossible)':'combinations = '+count}</div>
    ${showCombos?`<div style="font-size:12px;color:var(--color-text-secondary);line-height:1.8">${combos.map(c=>`${A} = ${c.join(' + ')}`).join('<br>')}</div>`:''}
  </div>`;
}

function highlightItems(){
  const step=KP.steps[KP.idx];
  KP.sortedCoins.forEach((_,idx)=>{
    const c=document.getElementById(`kp-ic-${idx}`);
    if(!c) return;
    const active=step.item===idx+1&&step.phase!=='done'&&step.phase!=='init';
    c.className='kp-icard'+(active?' active':'');
  });
}

function render(){
  document.getElementById('kp-stat').textContent=KP.steps[KP.idx].desc;
  highlightItems();buildTable();buildResult();
  document.getElementById('kp-pb').textContent=KP.playing?'⏸ Pause':'▶ Play';
}

function initUI(){
  const cont=document.getElementById('kp-items');
  cont.innerHTML='';
  const sorted=[...KP.coins].sort((a,b)=>a-b);
  KP.sortedCoins=sorted;
  sorted.forEach((c,idx)=>{
    const d=document.createElement('div');
    d.id=`kp-ic-${idx}`;d.className='kp-icard';
    d.innerHTML=`<div style="font-size:11px;color:var(--color-text-tertiary)">coin ${idx+1}</div><input type="number" value="${c}" min="1" max="${Math.max(KP.A,1)}" style="font-size:15px;font-weight:500">`;
    d.querySelector('input').onchange=e=>{KP.coins[idx]=Math.max(1,+e.target.value);kpRebuild();};
    cont.appendChild(d);
  });
  const ab=document.createElement('button');
  ab.textContent='+ coin';ab.style.cssText='align-self:center;font-size:12px';
  ab.onclick=()=>{if(KP.coins.length<8){KP.coins.push(3);kpRebuild();}};
  cont.appendChild(ab);
  if(KP.coins.length>1){
    const rb=document.createElement('button');
    rb.textContent='− coin';rb.style.cssText='align-self:center;font-size:12px';
    rb.onclick=()=>{KP.coins.pop();kpRebuild();};
    cont.appendChild(rb);
  }
}

function kpPlay(){
  KP.playing=true;render();
  KP.timer=setInterval(()=>{
    if(KP.idx>=KP.steps.length-1){kpPause();return;}
    KP.idx++;render();
  },KP.speeds[KP.spdIdx]);
}
function kpPause(){KP.playing=false;clearInterval(KP.timer);render();}

window.kpReset=()=>{kpPause();KP.idx=0;render();};
window.kpStep=()=>{if(KP.playing)kpPause();if(KP.idx<KP.steps.length-1){KP.idx++;render();}};
window.kpToggle=()=>{if(KP.playing)kpPause();else kpPlay();};
window.kpRebuild=()=>{
  kpPause();
  KP.A=Math.max(0,Math.min(20,parseInt(document.getElementById('kp-cap').value)||0));
  compute();initUI();KP.idx=0;render();
};
window.kpSpd=()=>{
  KP.spdIdx=parseInt(document.getElementById('kp-spd').value)-1;
  if(KP.playing){clearInterval(KP.timer);kpPlay();}
};

compute();initUI();render();
})();
</script>
